common_focus: >
  Attacker Profile: an untrusted tenant controls requests and referenced
  artifacts. Impact Boundaries: cross-service authorization bypass, tenant
  isolation loss, or privileged execution. Technical Lifecycle Focus: request
  normalization, identity propagation, artifact materialization, execution,
  and status callbacks. Exclusions: availability-only overload without a
  violated isolation contract.

max_concurrency: 8

top_K:
  chain: 16

gather:
  max_pair_passes: 12
  max_chain_length: 6
  max_candidates_before_top_k: 200
  max_battle_rounds: 3
  require_cross_target: true

node:
  gather_analyze_attack_surface:
    runtime: codex
    focus: ""

  gather_plan_chains:
    runtime: codex
    focus: ""

  gather_chain_investigate_subtask:
    runtime: codex
    focus: ""

  gather_chain_critic_subtask:
    runtime: codex
    focus: ""

  gather_chain_finalizer_subtask:
    runtime: codex
    focus: ""

  gather_report_group_adjudicator:
    runtime: codex
    focus: ""

  summary:
    runtime: claude_code

  polish_report:
    runtime: claude_code
