[project]
name = "zeromdash"
version = "0.1.0"
description = "ZeroMDASH: an open re-implementation of Microsoft MDASH, orchestrating coding-agent runtimes with LangGraph + LangChain."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.4",
    "langchain>=1.3.4",
    "langchain-core>=1.4.0",
    "pydantic>=2.13.1",
    "typing-extensions>=4.10",
    "python-dotenv>=1.0",
    "click>=8.3.2",
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "cvss>=3.6,<4",
]

[project.optional-dependencies]
# 可观测(自建 Langfuse)。按需安装: pip install -e ".[observability]"
observability = [
    "langfuse>=4.7.1",
]
# Optional provider integrations for ZEROMDASH_DEEPAGENT_MODEL prefixes.
deepagent-openai = [
    "langchain-openai>=1.1.3",
]
deepagent-anthropic = [
    "langchain-anthropic>=1.2.0",
]
deepagent = [
    "deepagents>=0.6.8",
]
all = [
    "langfuse>=4.7.1",
    "deepagents>=0.6.8",
    "langchain-openai>=1.1.3",
    "langchain-anthropic>=1.2.0",
]

[project.scripts]
zeromdash = "zeromdash.cli:main"
zeromdash-repro = "zeromdash_repro.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zeromdash*", "zeromdash_repro*"]

[tool.setuptools.package-data]
zeromdash = [
    "presets/**/*",
    "presets/.claude/*",
    "presets/.codex/*",
    "presets/.dsh/*",
    "presets/.kimi-code/*",
]
